name: Corpus and independent qualification
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m frbench check
      - run: python -m pytest -q -ra --junitxml=results/harness.xml
      - run: python -m ruff check frbench tests scripts
      - run: python scripts/validate_distribution.py --output results/distribution.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-${{ matrix.os }}-${{ matrix.python }}
          path: results/
  native-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ivbeg/filerepack
          ref: 95827f3206d68760819d1a0f21ab9acfcf74313b
          path: implementation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent readers and implementation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip zip pigz ffmpeg ghostscript imagemagick unrar lzip lzop hdf5-tools netcdf-bin
          python -m pip install -e '.[verify,dev]' -e './implementation[serialization]'
      - run: python -m frbench doctor > environment.json
      - run: python -m frbench check --strict-verifiers
      - run: python scripts/qualify_oracles.py --strict --output results/conformance.json
      - run: python -m frbench coverage --filerepack implementation --strict --json > results/coverage.json
      - run: python -m frbench run --filerepack implementation --tier smoke --strict-verifiers --min-verified 12 --require-outcomes --output results/smoke
      - run: python -m frbench run --filerepack implementation --tier control --strict-verifiers --min-verified 24 --require-outcomes --output results/controls
      - name: Full repeated benchmark
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/current_baseline.py --filerepack implementation --revision 95827f3206d68760819d1a0f21ab9acfcf74313b --output results/full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-qualification
          path: |
            results/
            environment.json
